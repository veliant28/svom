services:
  postgres:
    image: postgres:18.3
    container_name: svom_postgres
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svom}
      POSTGRES_USER: ${POSTGRES_USER:-svom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svom}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  auto_db_pro_postgres:
    image: postgres:18.3
    container_name: svom_auto_db_pro_postgres
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: ${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      POSTGRES_USER: ${AUTODB_PRO_LOCAL_DATABASE_USER:-svom}
      POSTGRES_PASSWORD: ${AUTODB_PRO_LOCAL_DATABASE_PASSWORD:-svom}
    ports:
      - "${AUTODB_PRO_LOCAL_DATABASE_PORT:-5434}:5432"
    volumes:
      - auto_db_pro_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  redis:
    image: redis:8.0.6
    container_name: svom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    container_name: svom_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: svom_libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ru,uk
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: svom_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},backend,svom_backend
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTODB_PRO_LOCAL_DATABASE_URL: postgres://${AUTODB_PRO_LOCAL_DATABASE_USER:-svom}:${AUTODB_PRO_LOCAL_DATABASE_PASSWORD:-svom}@auto_db_pro_postgres:5432/${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      AUTODB_PRO_LOCAL_DATABASE_NAME: ${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SEARCH_BACKEND: ${SEARCH_BACKEND:-elasticsearch}
      AUTODB_OFFLINE_TRANSLATE_ENABLED: ${AUTODB_OFFLINE_TRANSLATE_ENABLED:-1}
      AUTODB_OFFLINE_TRANSLATE_PROVIDER: ${AUTODB_OFFLINE_TRANSLATE_PROVIDER:-libretranslate}
      AUTODB_OFFLINE_TRANSLATE_URL: ${AUTODB_OFFLINE_TRANSLATE_URL:-http://libretranslate:5000}
      AUTODB_OFFLINE_TRANSLATE_API_KEY: ${AUTODB_OFFLINE_TRANSLATE_API_KEY:-}
      AUTODB_GOOGLE_TRANSLATE_URL: ${AUTODB_GOOGLE_TRANSLATE_URL:-https://translation.googleapis.com/language/translate/v2}
      AUTODB_GOOGLE_TRANSLATE_API_KEY: ${AUTODB_GOOGLE_TRANSLATE_API_KEY:-}
      AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS: ${AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS:-4000}
    volumes:
      - ./backend:/app
      - ./Backup:/Backup
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auto_db_pro_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/seo/public/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    command: bash -lc "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: svom_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      NEXT_SERVER_API_BASE_URL: ${NEXT_SERVER_API_BASE_URL:-http://backend:8000/api}
      NODE_ENV: production
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: sh -lc "npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"

  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: svom_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTODB_PRO_LOCAL_DATABASE_URL: postgres://${AUTODB_PRO_LOCAL_DATABASE_USER:-svom}:${AUTODB_PRO_LOCAL_DATABASE_PASSWORD:-svom}@auto_db_pro_postgres:5432/${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      AUTODB_PRO_LOCAL_DATABASE_NAME: ${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SEARCH_BACKEND: ${SEARCH_BACKEND:-elasticsearch}
      AUTODB_OFFLINE_TRANSLATE_ENABLED: ${AUTODB_OFFLINE_TRANSLATE_ENABLED:-1}
      AUTODB_OFFLINE_TRANSLATE_PROVIDER: ${AUTODB_OFFLINE_TRANSLATE_PROVIDER:-libretranslate}
      AUTODB_OFFLINE_TRANSLATE_URL: ${AUTODB_OFFLINE_TRANSLATE_URL:-http://libretranslate:5000}
      AUTODB_OFFLINE_TRANSLATE_API_KEY: ${AUTODB_OFFLINE_TRANSLATE_API_KEY:-}
      AUTODB_GOOGLE_TRANSLATE_URL: ${AUTODB_GOOGLE_TRANSLATE_URL:-https://translation.googleapis.com/language/translate/v2}
      AUTODB_GOOGLE_TRANSLATE_API_KEY: ${AUTODB_GOOGLE_TRANSLATE_API_KEY:-}
      AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS: ${AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS:-4000}
    volumes:
      - ./backend:/app
      - ./Backup:/Backup
    depends_on:
      postgres:
        condition: service_healthy
      auto_db_pro_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    command: bash -lc "celery -A config worker -l info -Q ${CELERY_FAST_QUEUES:-celery} -O fair --prefetch-multiplier=1 --concurrency=${CELERY_FAST_WORKER_CONCURRENCY:-6}"

  celery_beat:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: svom_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTODB_PRO_LOCAL_DATABASE_URL: postgres://${AUTODB_PRO_LOCAL_DATABASE_USER:-svom}:${AUTODB_PRO_LOCAL_DATABASE_PASSWORD:-svom}@auto_db_pro_postgres:5432/${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      AUTODB_PRO_LOCAL_DATABASE_NAME: ${AUTODB_PRO_LOCAL_DATABASE_NAME:-Auto_DB_Pro}
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SEARCH_BACKEND: ${SEARCH_BACKEND:-elasticsearch}
      AUTODB_OFFLINE_TRANSLATE_ENABLED: ${AUTODB_OFFLINE_TRANSLATE_ENABLED:-1}
      AUTODB_OFFLINE_TRANSLATE_PROVIDER: ${AUTODB_OFFLINE_TRANSLATE_PROVIDER:-libretranslate}
      AUTODB_OFFLINE_TRANSLATE_URL: ${AUTODB_OFFLINE_TRANSLATE_URL:-http://libretranslate:5000}
      AUTODB_OFFLINE_TRANSLATE_API_KEY: ${AUTODB_OFFLINE_TRANSLATE_API_KEY:-}
      AUTODB_GOOGLE_TRANSLATE_URL: ${AUTODB_GOOGLE_TRANSLATE_URL:-https://translation.googleapis.com/language/translate/v2}
      AUTODB_GOOGLE_TRANSLATE_API_KEY: ${AUTODB_GOOGLE_TRANSLATE_API_KEY:-}
      AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS: ${AUTODB_OFFLINE_TRANSLATE_TIMEOUT_MS:-4000}
    volumes:
      - ./backend:/app
      - ./Backup:/Backup
    depends_on:
      postgres:
        condition: service_healthy
      auto_db_pro_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    command: bash -lc "celery -A config beat -l info"

volumes:
  postgres_data:
  auto_db_pro_postgres_data:
  redis_data:
  elastic_data:
  frontend_node_modules:
  frontend_next:
